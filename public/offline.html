<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07374e"><title>APSR | الاتصال بالإنترنت</title>
<style>
@font-face{font-family:Tajawal;src:url('/fonts/Tajawal-Regular.ttf')}@font-face{font-family:Tajawal;src:url('/fonts/Tajawal-Bold.ttf');font-weight:700}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#07374e;color:#fff;font-family:Tajawal,Arial,sans-serif;display:grid;place-items:center;padding:24px}main{max-width:520px;width:100%;padding:32px 8px}img{width:72px;height:72px}small{display:block;margin-top:24px;color:#9edee9;letter-spacing:1px}h1{font-size:32px;line-height:1.4;margin:18px 0}p{font-size:18px;line-height:1.8;color:#c2dce5}button{font:700 16px Tajawal,Arial,sans-serif;padding:14px 24px;min-height:48px;background:#b0edf5;color:#07374e;border:0;cursor:pointer;margin-top:16px}button:focus-visible{outline:3px solid white;outline-offset:5px}.language{position:absolute;inset-inline-end:24px;top:12px;background:transparent;color:#fff;font-size:15px}footer{margin-top:32px;font-size:13px;color:#a9cdd9}
</style></head><body><button class="language" id="language">English</button><main><img src="/icons/icon-192.png" alt="APSR"><small id="label">بوابة الخدمات</small><h1 id="heading">أنت غير متصل بالإنترنت</h1><p id="description">أعد الاتصال لفتح الخدمات ومتابعة طلباتك. تحتاج الشكاوى والمراسلات إلى اتصال بالإنترنت.</p><button id="retry">إعادة المحاولة</button><footer id="footer">عرض توضيحي، ليس موقعاً حكومياً رسمياً.</footer></main>
<script>
let lang='ar';try{lang=localStorage.getItem('apsr-lang')==='en'?'en':'ar'}catch{}
const copy={ar:['بوابة الخدمات','أنت غير متصل بالإنترنت','أعد الاتصال لفتح الخدمات ومتابعة طلباتك. تحتاج الشكاوى والمراسلات إلى اتصال بالإنترنت.','إعادة المحاولة','عرض توضيحي، ليس موقعاً حكومياً رسمياً.'],en:['SERVICE PORTAL','You’re offline','Reconnect to open services and follow your requests. Complaints and messages need an internet connection.','Try again','Demonstration, not an official government website.']};
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';['label','heading','description','retry','footer'].forEach((id,i)=>document.getElementById(id).textContent=copy[lang][i]);document.getElementById('language').textContent=lang==='ar'?'English':'العربية';document.title='APSR | '+copy[lang][1]}
document.getElementById('language').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('apsr-lang',lang)}catch{}render()};document.getElementById('retry').onclick=()=>location.reload();render();
</script></body></html>
